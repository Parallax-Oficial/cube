<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cube</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/cube-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #c6ff00;
    --fondo: #000000;
    --texto: #ffffff;
    --texto-suave: #b9b9b9;
    --borde: #1c1c1c;
    --placeholder: #141414;
    --radio: 15px;
    --margen: 4vw;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { background: var(--fondo); }

  body {
    font-family: 'Poppins', sans-serif;
    color: var(--texto);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  .app { max-width: 1100px; margin: 0 auto; }

  /* ---------- HEADER ---------- */
  header {
    display: flex;
    align-items: center;
    gap: clamp(8px, 3vw, 16px);
    padding: 12px var(--margen);
    min-height: 64px;
  }

  .menu-btn {
    flex: 0 0 auto;
    width: 25px; height: 25px;
    display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 4.5px;
  }
  .menu-btn span { display: block; flex: 0 0 auto; height: 2.2px; width: 100%; background: #fff; border-radius: 2px; }

  .logo {
    flex: 0 0 auto;
    font-weight: 800;
    font-size: clamp(1.7rem, 8vw, 2.4rem);
    line-height: 1;
    letter-spacing: -.5px;
    text-transform: lowercase;
    color: var(--verde);
    display: flex; align-items: center;
    padding-bottom: 4px;
    margin-left: 6px;
  }

  .header-der { margin-left: auto; display: flex; align-items: center; gap: clamp(8px, 3vw, 14px); flex: 0 0 auto; }

  .buscar-btn { flex: 0 0 auto; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .buscar-btn svg { width: 24px; height: 24px; }

  .unete-btn {
    flex: 0 0 auto;
    background: #fff; color: #000;
    font-weight: 600; font-size: clamp(.72rem, 3.2vw, .9rem);
    padding: 9px clamp(12px, 4vw, 18px);
    border-radius: 999px;
    white-space: nowrap;
    line-height: 1.2;
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    flex: 0 0 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always; /* no deja saltarse banners al deslizar */
    aspect-ratio: 16 / 9;
    border-radius: var(--radio);
    border: 2px solid var(--borde);
    background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 55%);
    pointer-events: none;
  }
  .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-wrap { margin: 6px var(--margen) 0; }
  .hero-track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    border-radius: var(--radio);
  }
  .hero-track::-webkit-scrollbar { display: none; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .dot {
    width: 8px; height: 8px; padding: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.3);
    transition: background .2s;
  }
  .dot.activo { background: #fff; }
  .hero-info {
    text-shadow: 0 1px 8px rgba(0,0,0,.75);
  }
  .hero-info {
    position: absolute; left: 7%; right: 22%; bottom: 8%;
    z-index: 2;
    font-weight: 400;
    color: var(--texto-suave);
  }
  .hero-genero { font-size: clamp(.8rem, 3.2vw, 1.1rem); margin-bottom: 2px; }
  .hero-sinopsis { font-size: clamp(.85rem, 3.6vw, 1.25rem); line-height: 1.25; }

  .play-btn {
    position: absolute; right: 7%; bottom: 8%;
    z-index: 2;
    width: clamp(52px, 14vw, 84px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--verde);
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn svg { width: 44%; height: 44%; margin-left: 6%; }

  /* ---------- SECCIONES ---------- */
  .seccion { margin-top: 44px; }

  .seccion h2 {
    font-weight: 700;
    font-size: clamp(1.25rem, 5.4vw, 1.9rem);
    padding: 0 var(--margen);
    margin-bottom: 18px;
    letter-spacing: -.2px;
  }

  .carrusel {
    display: flex;
    gap: 2.5vw;
    padding: 0 var(--margen);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-padding-left: var(--margen);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .carrusel::-webkit-scrollbar { display: none; }

  .portada {
    flex: 0 0 calc((100% - 2.5vw) / 2.15);
    aspect-ratio: 16 / 9;
    border-radius: var(--radio);
    background: var(--placeholder);
    scroll-snap-align: start;
    overflow: hidden;
    position: relative;
  }
  .badge {
    position: absolute; top: 8px; left: 8px;
    z-index: 2;
    background: rgba(0,0,0,.65);
    color: var(--verde);
    font-size: clamp(.55rem, 2.2vw, .7rem);
    font-weight: 600;
    letter-spacing: .3px;
    padding: 4px 9px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .portada img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (min-width: 700px) {
    :root { --margen: 28px; }
    .carrusel { gap: 18px; }
    .portada { flex-basis: 30%; }
  }

  /* ---------- BÚSQUEDA ---------- */
  #buscar { display: none; max-width: 1100px; margin: 0 auto; padding: 14px var(--margen) 40px; }
  body.buscando #buscar { display: block; }
  body.buscando #home { display: none; }

  .buscar-top { display: flex; align-items: center; gap: 10px; }
  .volver-btn { flex: 0 0 auto; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; margin-left: -6px; }
  .volver-btn svg { width: 26px; height: 26px; }
  .buscador {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 18px;
    background: var(--placeholder);
    border: 2px solid var(--borde);
    border-radius: 20px;
  }
  .buscador input {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: #fff; font-family: inherit; font-size: 1rem;
  }
  .buscador input::placeholder { color: #8a8a8a; }
  .buscador input::-webkit-search-cancel-button { display: none; }
  .buscador svg { flex: 0 0 auto; width: 26px; height: 26px; }
  .buscador:focus-within { border-color: #3a3a3a; }

  #buscar h2 {
    font-weight: 700;
    font-size: clamp(1.25rem, 5.4vw, 1.9rem);
    margin: 30px 0 18px;
    letter-spacing: -.2px;
  }
  .grilla { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .grilla .portada { flex: none; width: 100%; }
  .sin-resultados { color: var(--texto-suave); font-size: 1rem; padding: 10px 0; }
  .sin-resultados[hidden] { display: none; }
  @media (min-width: 700px) {
    .grilla { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  }

  /* ---------- MENÚ LATERAL ---------- */
  body.menu-abierto { overflow: hidden; }
  .menu-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.65);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
  }
  .menu {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 60;
    width: min(86vw, 360px);
    background: #000;
    border-right: 1px solid var(--borde);
    display: flex; flex-direction: column;
    transform: translateX(-100%); visibility: hidden;
    transition: transform .3s cubic-bezier(.22,.8,.3,1), visibility .3s;
    padding-top: env(safe-area-inset-top, 0px);
  }
  body.menu-abierto .menu-overlay { opacity: 1; visibility: visible; }
  body.menu-abierto .menu { transform: none; visibility: visible; }

  .menu-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px 22px; }
  .menu .logo { margin: 0; padding: 0; }
  .cerrar-menu { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; margin-right: -8px; }
  .cerrar-menu svg { width: 24px; height: 24px; }

  .menu-scroll { flex: 1; overflow-y: auto; padding: 8px 20px calc(30px + env(safe-area-inset-bottom, 0px)) 22px; }
  .menu-titulo {
    font-weight: 700; font-size: 1.1rem; letter-spacing: -.2px;
    margin: 26px 0 14px;
  }
  .menu-lista { list-style: none; }
  .menu-item {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 2px;
    font-size: .92rem; font-weight: 400; text-align: left;
    color: rgba(255,255,255,.7);
    transition: color .15s, transform .15s;
  }
  .menu-item:active { color: #fff; transform: translateX(3px); }
  .menu-item svg { width: 16px; height: 16px; opacity: .45; }

  .menu-cats { list-style: none; }
  .menu-cats li + li { margin-top: 4px; }
  .cat {
    display: block; width: 100%; text-align: left;
    padding: 7px 2px;
    font-weight: 600; font-size: 1.2rem; letter-spacing: -.3px;
    text-transform: lowercase; line-height: 1.2;
    transition: transform .15s, opacity .15s;
  }
  .cat:active { transform: translateX(4px); opacity: .8; }
  .cat-tv          { color: #a56bff; }   /* morado */
  .cat-doc         { color: #4fc3f7; }   /* celeste */
  .cat-interactive { color: #1fd6a1; }   /* esmeralda */
  .cat-underground { color: #c4343c; }   /* rojo apagado */
  .cat-platinum    { color: #c3c8d1; }   /* plata */

  /* ---------- APARTADO (lista de historias de un grupo) ---------- */
  #apartado { display: none; max-width: 1100px; margin: 0 auto; padding: 14px var(--margen) 40px; }
  body.en-apartado #apartado { display: block; }
  body.en-apartado #home { display: none; }
  .apartado-top { display: flex; align-items: center; gap: 10px; min-height: 56px; }
  #apartado h1 { font-weight: 700; font-size: clamp(1.4rem, 6vw, 2rem); letter-spacing: -.3px; }
  .apartado-cant { color: var(--texto-suave); font-size: .9rem; margin: 6px 0 22px 36px; }
</style>
</head>
<body>
<div class="app">

<div id="home">

  <!-- HEADER -->
  <header>
    <button class="menu-btn" id="abrirMenu" aria-label="Menú"><span></span><span></span><span></span></button>
    <div class="logo">cube</div>
    <div class="header-der">
      <button class="buscar-btn" id="abrirBuscar" aria-label="Buscar historias">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button class="unete-btn">Únete a Cube</button>
    </div>
  </header>

  <!-- HERO (varios banners) -->
  <section class="hero-wrap" aria-label="Destacados">
    <div class="hero-track" id="heroTrack"></div>
    <div class="dots" id="dots"></div>
  </section>

  <!-- SECCIONES -->
  <main id="secciones"></main>

</div><!-- /home -->

<!-- BÚSQUEDA -->
<section id="buscar" aria-label="Buscar historias">
  <div class="buscar-top">
    <button class="volver-btn" id="cerrarBuscar" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <label class="buscador">
      <input id="campoBuscar" type="search" placeholder="¿Qué quieres ver hoy?" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar historias">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </label>
  </div>
  <h2 id="tituloBuscar">Todas las historias</h2>
  <div class="grilla" id="grilla"></div>
  <p class="sin-resultados" id="sinResultados" hidden>No encontramos historias con ese nombre.</p>
</section>

<!-- APARTADO -->
<section id="apartado" aria-label="Historias">
  <div class="apartado-top">
    <button class="volver-btn" id="cerrarApartado" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 id="apartadoTitulo"></h1>
  </div>
  <p class="apartado-cant" id="apartadoCant"></p>
  <div class="grilla" id="apartadoGrilla"></div>
</section>

<!-- MENÚ -->
<div class="menu-overlay" id="menuOverlay"></div>
<nav class="menu" id="menu" aria-label="Menú" aria-hidden="true">
  <div class="menu-top">
    <div class="logo">cube</div>
    <button class="cerrar-menu" id="cerrarMenu" aria-label="Cerrar menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  </div>
  <div class="menu-scroll">
    <h3 class="menu-titulo">Consume por Capítulos</h3>
    <ul class="menu-lista">
      <li><button class="menu-item" data-ap="0"><span>0 capítulos</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button></li>
      <li><button class="menu-item" data-ap="3"><span>3 capítulos</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button></li>
      <li><button class="menu-item" data-ap="4-5"><span>4-5 capítulos</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button></li>
      <li><button class="menu-item" data-ap="5+"><span>+5 capítulos</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button></li>
    </ul>

    <h3 class="menu-titulo">Categorías</h3>
    <ul class="menu-cats">
      <li><button class="cat cat-tv">tv shows</button></li>
      <li><button class="cat cat-doc">documentals</button></li>
      <li><button class="cat cat-interactive">interactive</button></li>
      <li><button class="cat cat-underground">underground</button></li>
      <li><button class="cat cat-platinum">platinum</button></li>
    </ul>
  </div>
</nav>

</div>

<script>
  // Dirección donde están las imágenes (jsDelivr sirve los archivos de tu repositorio de GitHub).
  // Para usar otro repositorio, cambia solo esta línea.
  const IMG_BASE = "https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/";


  // ---------- HERO ----------
  const heroes = [
    { img: "bigfoot.webp", alt: "BIGFOOT",
      genero: "Acción • 2026",
      sinopsis: "La huida de un monstruo gigante traerá consigo una sorpresa inesperada." },
    { img: "eternamente-vivo-hero.webp", alt: "Eternamente Vivo con Valak Seraphel",
      genero: "Sobrenatural • 2026",
      sinopsis: "En una realidad paralela, un demonio le ofrece a Martino “lindos recuerdos”." },
    { img: "golem-hero.webp", alt: "Golem: El Protector de Judíos",
      genero: "Thriller • 2026",
      sinopsis: "La última noche de su madre judía será la primera de su leyenda." },
    { img: "familia-rani-hero.webp", alt: "La Familia Rani",
      genero: "Thriller • 2025",
      sinopsis: "Un viaje a la mente más espectacular y grotesca de su autor." }
  ];

  const track = document.getElementById('heroTrack');
  const dotsBox = document.getElementById('dots');
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z" fill="#000"/></svg>';

  heroes.forEach((h, i) => {
    track.insertAdjacentHTML('beforeend',
      `<article class="hero" aria-label="${h.alt}">
        <img class="hero-img" src="${IMG_BASE}${h.img}" alt="${h.alt}">
        <div class="hero-info">
          <p class="hero-genero">${h.genero}</p>
          <p class="hero-sinopsis">${h.sinopsis}</p>
        </div>
        <button class="play-btn" aria-label="Reproducir ${h.alt}">${PLAY}</button>
      </article>`);
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' activo' : '');
    d.setAttribute('aria-label', 'Ir al banner ' + (i + 1));
    d.onclick = () => { irA(i); iniciarAuto(); };
    dotsBox.appendChild(d);
  });

  track.addEventListener('scroll', () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    [...dotsBox.children].forEach((d, n) => d.classList.toggle('activo', n === i));
  }, { passive: true });

  // ---------- Cambio automático ----------
  const SEGUNDOS_AUTO = 5;   // cambia aquí cada cuántos segundos pasa solo (4 a 6 recomendado)
  let timerAuto = null;

  function irA(i) { track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' }); }
  function actual() { return Math.round(track.scrollLeft / track.clientWidth); }
  function detenerAuto() { clearInterval(timerAuto); timerAuto = null; }
  function iniciarAuto() {
    detenerAuto();
    timerAuto = setInterval(() => irA((actual() + 1) % heroes.length), SEGUNDOS_AUTO * 1000);
  }

  // Si la persona toca o desliza, se pausa y se reinicia la cuenta al soltar
  track.addEventListener('touchstart', detenerAuto, { passive: true });
  track.addEventListener('touchend', iniciarAuto, { passive: true });
  track.addEventListener('touchcancel', iniciarAuto, { passive: true });
  track.addEventListener('mouseenter', detenerAuto);
  track.addEventListener('mouseleave', iniciarAuto);
  document.addEventListener('visibilitychange', () => document.hidden ? detenerAuto() : iniciarAuto());

  iniciarAuto();

  // Cada sección: título + lista de portadas (nombre del archivo en /img y texto alternativo).
  // Las que no tienen imagen todavía se muestran como portada vacía.
  const secciones = [
    { titulo: "Te Recomendamos", portadas: [
      { img: "eternamente-vivo.webp",  alt: "Eternamente Vivo con Amadeus Shell" },
      { img: "las-entrevistas.webp",   alt: "Las Entrevistas" },
      { img: "metalosis-maligna.webp", alt: "Metalosis Maligna" },
      { img: "gorgeous-vortex.webp",   alt: "Gorgeous Vortex" },
      { img: "retorcidos.webp",        alt: "Retorcidos" }
    ]},
    { titulo: "Cero Capítulos", portadas: [
      { img: "muevete-al-minuto.webp", alt: "Muévete al Minuto" },
      { img: "metalosis-maligna.webp", alt: "Metalosis Maligna" },
      { img: "retorcidos.webp",        alt: "Retorcidos" },
      { img: "nada.webp",              alt: "Nada" },
      { img: "retorcidos-2.webp",      alt: "Retorcidos 2" },
      { img: "strike.webp",            alt: "Strike" },
      { img: "gorgeous-vortex.webp",   alt: "Gorgeous Vortex" },
      { img: "obedece.webp",           alt: "Obedece" },
      { img: "ultimate.webp",          alt: "Ultimate" },
      { img: "valentine.webp",         alt: "Valentine" }
    ]},
    { titulo: "Tres Capítulos", portadas: [
      { img: "mama-dogs.webp", alt: "Mama Dogs" },
      { img: "el-telefono.webp", alt: "El Teléfono" },
      { img: "bigfoot-2.webp", alt: "Bigfoot" },
      { img: "ratman.webp", alt: "Ratman" },
      { img: "without-warning.webp", alt: "Without Warning" },
      { img: "golem.webp", alt: "Golem" },
      { img: "el-ciguenon.webp", alt: "El Cigüeñon", pronto: true },
      { img: "atraco.webp", alt: "Atraco", pronto: true },
      { img: "frogman.webp", alt: "Frogman", pronto: true },
      { img: "cuarentena.webp", alt: "Cuarentena", pronto: true },
      { img: "cuarentena-revival.webp", alt: "Cuarentena Revival", pronto: true },
      { img: "vigilia.webp", alt: "Vigilia", pronto: true },
      { img: "cuarentena-2.webp", alt: "Cuarentena 2", pronto: true },
      { img: "moby-dick-profundo.webp", alt: "Moby Dick Profundo", pronto: true },
      { img: "cuarentena-iv.webp", alt: "Cuarentena IV", pronto: true },
      { img: "apollo-18.webp", alt: "Apollo 18", pronto: true },
      { img: "musaranas.webp", alt: "Musarañas: Relatos de C·C·H", pronto: true },
      { img: "behemoth.webp", alt: "Behemoth", pronto: true },
      { img: "hydra-the-lost-island.webp", alt: "Hydra: The Lost Island", pronto: true }
    ]},
    { titulo: "Cuatro o Cinco Capítulos", portadas: [
      { img: "eternamente-vivo.webp", alt: "Eternamente Vivo con Amadeus Shell" },
      { img: "fenomeno-vulgar.webp", alt: "Fenómeno Vulgar" },
      { img: "eternamente-vivo-dante.webp", alt: "Eternamente Vivo con Dante el Grande" },
      { img: "dont-hug-me-im-scared.webp", alt: "Don't Hug Me I'm Scared", pronto: true },
      { img: "un-eternauta.webp", alt: "Un Eternauta", pronto: true },
      { img: "la-dama-roja.webp", alt: "La Dama Roja", pronto: true },
      { img: "las-entrevistas-2.webp", alt: "Las Entrevistas 2", pronto: true },
      { img: "la-familia-rani.webp", alt: "La Familia Rani" },
      { img: "el-club-de-clubes.webp", alt: "El Club de Clubes", pronto: true },
      { img: "cuando-el-mal-acecha.webp", alt: "Cuando el Mal Acecha", pronto: true },
      { img: "triangle-room-2.webp", alt: "Triangle Room 2", pronto: true },
      { img: "la-dama-dorada.webp", alt: "La Dama Dorada", pronto: true },
      { img: "eternamente-vivo-valak.webp", alt: "Eternamente Vivo con Valak Seraphel" },
      { img: "el-club-de-clubes-2.webp", alt: "El Club de Clubes II", pronto: true },
      { img: "menem.webp", alt: "Menem" },
      { img: "oso-negro.webp", alt: "Oso Negro", pronto: true },
      { img: "cch-metal-crujiente.webp", alt: "C·C·H Metal Crujiente", pronto: true },
      { img: "chernobyl-tapes.webp", alt: "The Chernobyl Tapes", pronto: true },
      { img: "el-club-de-clubes-3.webp", alt: "El Club de Clubes 3", pronto: true },
      { img: "los-sapos.webp", alt: "Los Sapos", pronto: true }
    ]},
    { titulo: "Recomendados de Mlive", portadas: [
      { img: "divina-comedia.webp", alt: "Divina Comedia" },
      { img: "las-entrevistas.webp", alt: "Las Entrevistas" },
      { img: "triangle-room.webp", alt: "Triangle Room" },
      { img: "eternamente-vivo-biografia.webp", alt: "Eternamente Vivo: Biografía, la vida del autor" },
      { img: "eternamente-vivo-murray.webp", alt: "Eternamente Vivo con Murray Franklin" }
    ]}
  ];
  const PORTADAS_POR_SECCION = 5;

  const contenedor = document.getElementById('secciones');
  secciones.forEach(({ titulo, portadas }) => {
    const sec = document.createElement('section');
    sec.className = 'seccion';
    const items = portadas
      ? portadas.map(p => `<div class="portada">${p.pronto ? '<span class="badge">Próximamente</span>' : ''}<img src="${IMG_BASE}${p.img}" alt="${p.alt}" loading="lazy"></div>`).join('')
      : '<div class="portada"></div>'.repeat(PORTADAS_POR_SECCION);
    sec.innerHTML = `<h2>${titulo}</h2><div class="carrusel">${items}</div>`;
    contenedor.appendChild(sec);
  });

  // ---------- BÚSQUEDA ----------
  // Catálogo: todas las portadas de todas las secciones, sin repetir, ordenadas de la A a la Z.
  const catalogo = [];
  const vistas = new Set();
  secciones.forEach(sec => (sec.portadas || []).forEach(p => {
    if (!vistas.has(p.img)) { vistas.add(p.img); catalogo.push(p); }
  }));
  catalogo.sort((a, b) => a.alt.localeCompare(b.alt, 'es', { sensitivity: 'base' }));

  const normal  = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const compacto = t => normal(t).replace(/[^a-z0-9]/g, '');   // así "cch" encuentra "C·C·H"

  const grilla = document.getElementById('grilla');
  const campo = document.getElementById('campoBuscar');
  const tituloBuscar = document.getElementById('tituloBuscar');
  const sinResultados = document.getElementById('sinResultados');

  // Se crean las portadas una sola vez y luego solo se muestran u ocultan
  const tarjetas = catalogo.map(p => {
    const el = document.createElement('div');
    el.className = 'portada';
    el.innerHTML = (p.pronto ? '<span class="badge">Próximamente</span>' : '') +
      `<img src="${IMG_BASE}${p.img}" alt="${p.alt}" loading="lazy">`;
    grilla.appendChild(el);
    return { el, normal: normal(p.alt), compacto: compacto(p.alt) };
  });

  function filtrar() {
    const q = normal(campo.value), qc = compacto(campo.value);
    let visibles = 0;
    tarjetas.forEach(t => {
      const coincide = !q || t.normal.includes(q) || (qc && t.compacto.includes(qc));
      t.el.style.display = coincide ? '' : 'none';
      if (coincide) visibles++;
    });
    tituloBuscar.textContent = q ? 'Resultados' : 'Todas las historias';
    sinResultados.hidden = visibles > 0;
  }
  campo.addEventListener('input', filtrar);
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') campo.blur(); });

  // ---------- Navegación entre pantallas (inicio / búsqueda / apartado / menú) ----------
  // Cada pantalla se guarda en el historial para que el botón "atrás" del celular funcione.
  let scrollGuardado = 0;
  const body = document.body;
  const estadoActual = () => (history.state && history.state.v) || null;

  function abrirBuscar() {
    scrollGuardado = window.scrollY;
    detenerAuto();
    body.classList.add('buscando');
    window.scrollTo(0, 0);
    history.pushState({ v: 'buscar' }, '');
    campo.focus();
  }
  function salirBuscar() {
    body.classList.remove('buscando');
    campo.value = ''; filtrar();
    window.scrollTo(0, scrollGuardado);
    iniciarAuto();
  }

  // Menú
  const menu = document.getElementById('menu');
  function abrirMenu() {
    scrollGuardado = window.scrollY;
    detenerAuto();
    body.classList.add('menu-abierto');
    menu.setAttribute('aria-hidden', 'false');
    history.pushState({ v: 'menu' }, '');
  }
  function ocultarMenu() {
    body.classList.remove('menu-abierto');
    menu.setAttribute('aria-hidden', 'true');
  }
  function cerrarMenu() {
    if (estadoActual() === 'menu') history.back(); else { ocultarMenu(); iniciarAuto(); }
  }

  // Apartado: lista de todas las historias de un grupo
  const unicas = lista => { const v = new Set(); return lista.filter(p => !v.has(p.img) && v.add(p.img)); };
  const deSeccion = t => unicas(secciones.find(s => s.titulo === t).portadas);
  const porImg = imgs => imgs.map(i => catalogo.find(p => p.img === i));

  const apartados = {
    '0':   { titulo: '0 capítulos',   historias: () => deSeccion('Cero Capítulos') },
    '3':   { titulo: '3 capítulos',   historias: () => deSeccion('Tres Capítulos') },
    '4-5': { titulo: '4-5 capítulos', historias: () => deSeccion('Cuatro o Cinco Capítulos') },
    '5+':  { titulo: '+5 capítulos',  historias: () => porImg([
      'las-entrevistas.webp', 'eternamente-vivo-biografia.webp', 'eternamente-vivo-murray.webp',
      'triangle-room.webp', 'divina-comedia.webp']) }
  };

  function abrirApartado(clave) {
    const ap = apartados[clave], lista = ap.historias();
    document.getElementById('apartadoTitulo').textContent = ap.titulo;
    document.getElementById('apartadoCant').textContent = lista.length + (lista.length === 1 ? ' historia' : ' historias');
    document.getElementById('apartadoGrilla').innerHTML = lista.map(p =>
      '<div class="portada">' + (p.pronto ? '<span class="badge">Próximamente</span>' : '') +
      `<img src="${IMG_BASE}${p.img}" alt="${p.alt}" loading="lazy"></div>`).join('');

    const veniaDelMenu = estadoActual() === 'menu';
    if (!veniaDelMenu) scrollGuardado = window.scrollY;
    ocultarMenu();
    body.classList.add('en-apartado');
    window.scrollTo(0, 0);
    // si venía del menú se reemplaza esa entrada del historial, así "atrás" vuelve directo al inicio
    if (veniaDelMenu) history.replaceState({ v: 'apartado' }, '');
    else history.pushState({ v: 'apartado' }, '');
  }
  function salirApartado() {
    body.classList.remove('en-apartado');
    window.scrollTo(0, scrollGuardado);
    iniciarAuto();
  }

  document.getElementById('abrirBuscar').addEventListener('click', abrirBuscar);
  document.getElementById('cerrarBuscar').addEventListener('click', () => estadoActual() === 'buscar' ? history.back() : salirBuscar());
  document.getElementById('abrirMenu').addEventListener('click', abrirMenu);
  document.getElementById('cerrarMenu').addEventListener('click', cerrarMenu);
  document.getElementById('menuOverlay').addEventListener('click', cerrarMenu);
  document.getElementById('cerrarApartado').addEventListener('click', () => estadoActual() === 'apartado' ? history.back() : salirApartado());
  document.querySelectorAll('.menu-item').forEach(b => b.addEventListener('click', () => abrirApartado(b.dataset.ap)));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && body.classList.contains('menu-abierto')) cerrarMenu(); });

  window.addEventListener('popstate', () => {
    const v = estadoActual();
    if (v !== 'menu' && body.classList.contains('menu-abierto')) { ocultarMenu(); if (!v) iniciarAuto(); }
    if (v !== 'buscar' && body.classList.contains('buscando')) salirBuscar();
    if (v !== 'apartado' && body.classList.contains('en-apartado')) salirApartado();
  });
</script>
</body>
</html>
