<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta — Cube</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/cube-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --verde: #c6ff00;
    --fondo: #000000;
    --texto: #ffffff;
    --texto-suave: #b9b9b9;
    --borde: #1c1c1c;
    --input-fondo: #141414;
    --error: #ff6b6b;
    --exito: #4cd137;
    --radio: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--fondo); min-height: 100vh; }
  body {
    font-family: 'Poppins', sans-serif;
    color: var(--texto);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  .volver-link {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--texto-suave);
    font-size: .95rem;
    margin-bottom: 40px;
    margin-top: 10px;
    transition: color .2s;
  }
  .volver-link:hover { color: #fff; }
  .volver-link svg {
    width: 1px; height: 11px;
    transform: rotate(180deg);
  }

  .logo {
    font-weight: 800;
    font-size: 2.8rem;
    color: var(--verde);
    margin-bottom: 8px;
  }
  .subtitulo {
    color: var(--texto-suave);
    font-size: 1rem;
    margin-bottom: 40px;
  }

  .contenedor {
    width: 100%;
    max-width: 420px;
  }

  .pestañas {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--borde);
  }
  .pestaña {
    padding: 10px 0;
    font-size: 1rem;
    font-weight: 500;
    color: var(--texto-suave);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all .2s;
  }
  .pestaña.activa {
    color: #fff;
    border-bottom-color: var(--verde);
  }

  .form-box {
    display: none;
  }
  .form-box.activo {
    display: block;
  }

  .grupo {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: .9rem;
    font-weight: 500;
    margin-bottom: 8px;
    color: #ddd;
  }
  input {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    background: var(--input-fondo);
    border: 2px solid var(--borde);
    border-radius: 12px;
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  input:focus {
    border-color: #3a3a3a;
  }
  input::placeholder {
    color: #555;
  }

  .btn {
    width: 100%;
    height: 52px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-verde {
    background: var(--verde);
    color: #000;
  }
  .btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .mensaje {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: .9rem;
    line-height: 1.4;
    display: none;
  }
  .mensaje.visible { display: block; }
  .mensaje.error { background: rgba(255, 107, 107, .1); color: var(--error); border: 1px solid rgba(255, 107, 107, .3); }
  .mensaje.exito { background: rgba(76, 209, 55, .1); color: var(--exito); border: 1px solid rgba(76, 209, 55, .3); }

  .sesion-activa {
    display: none;
    text-align: center;
  }
  .sesion-activa.visible { display: block; }
  .sesion-activa h2 { font-size: 1.4rem; margin-bottom: 10px; }
  .sesion-activa p { color: var(--texto-suave); margin-bottom: 24px; }
  .btn-salir {
    background: var(--borde);
    color: #fff;
  }

  .cargando {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid transparent;
    border-top-color: currentColor;
    border-radius: 50%;
    animation: girar .8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<a href="cube.html" class="volver-link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
  Volver a Cube
</a>

<div class="contenedor">

  <!-- LOGO -->
  <div style="text-align:center; margin-bottom:10px;">
    <h1 class="logo">cube</h1>
    <p class="subtitulo">Accede a todas las historias</p>
  </div>

  <!-- FORMULARIOS / SESIÓN -->
  <div id="formularios">
    <div class="pestañas">
      <button class="pestaña activa" data-pestaña="iniciar">Iniciar sesión</button>
      <button class="pestaña" data-pestaña="registrar">Crear cuenta</button>
    </div>

    <!-- INICIAR SESIÓN -->
    <div class="form-box activo" id="caja-iniciar">
      <div class="grupo">
        <label for="usuario-login">Nombre de usuario</label>
        <input type="text" id="usuario-login" placeholder="Tu nombre de usuario" autocomplete="username">
      </div>
      <div class="grupo">
        <label for="clave-login">Contraseña</label>
        <input type="password" id="clave-login" placeholder="Tu contraseña" autocomplete="current-password">
      </div>
      <button class="btn btn-verde" id="btn-iniciar">Entrar</button>
      <div class="mensaje" id="mensaje-iniciar"></div>
    </div>

    <!-- CREAR CUENTA -->
    <div class="form-box" id="caja-registrar">
      <div class="grupo">
        <label for="usuario-registro">Nombre de usuario</label>
        <input type="text" id="usuario-registro" placeholder="Elige un nombre de usuario" autocomplete="username">
      </div>
      <div class="grupo">
        <label for="email-registro">Correo electrónico</label>
        <input type="email" id="email-registro" placeholder="tu@correo.com" autocomplete="email">
      </div>
      <div class="grupo">
        <label for="clave-registro">Contraseña</label>
        <input type="password" id="clave-registro" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <button class="btn btn-verde" id="btn-registrar">Crear cuenta</button>
      <div class="mensaje" id="mensaje-registrar"></div>
    </div>
  </div>

  <!-- SESIÓN ACTIVA -->
  <div class="sesion-activa" id="sesion-activa">
    <h2>¡Bienvenido de nuevo! 🎉</h2>
    <p id="nombre-usuario"></p>
    <button class="btn btn-salir" id="btn-salir">Cerrar sesión</button>
  </div>

</div>

<script src="supabase.js"></script>
<script>
// ---------- PESTAÑAS ----------
const pestañas = document.querySelectorAll('.pestaña');
const cajaIniciar = document.getElementById('caja-iniciar');
const cajaRegistrar = document.getElementById('caja-registrar');

pestañas.forEach(p => {
  p.addEventListener('click', () => {
    pestañas.forEach(x => x.classList.remove('activa'));
    p.classList.add('activa');
    const cual = p.dataset.pestaña;
    if (cual === 'iniciar') {
      cajaIniciar.classList.add('activo');
      cajaRegistrar.classList.remove('activo');
    } else {
      cajaIniciar.classList.remove('activo');
      cajaRegistrar.classList.add('activo');
    }
    limpiarMensajes();
  });
});

function limpiarMensajes() {
  document.querySelectorAll('.mensaje').forEach(m => {
    m.classList.remove('visible', 'error', 'exito');
    m.textContent = '';
  });
}

function mostrarMensaje(el, texto, tipo) {
  el.textContent = texto;
  el.classList.add('visible', tipo);
  setTimeout(() => {
    el.classList.remove('visible');
  }, 6000);
}

function setCargando(boton, textoOriginal) {
  boton.disabled = true;
  boton.innerHTML = '<span class="cargando"></span>Procesando...';
  return () => {
    boton.disabled = false;
    boton.textContent = textoOriginal;
  };
}

// ---------- COMPROBAR SESIÓN AL CARGAR ----------
const formulariosDiv = document.getElementById('formularios');
const sesionActivaDiv = document.getElementById('sesion-activa');
const nombreUsuarioP = document.getElementById('nombre-usuario');

async function comprobarSesion() {
  const usuario = await window.cubeAuth.obtenerUsuarioActual();
  if (usuario) {
    mostrarSesionActiva(usuario);
  }
}

function mostrarSesionActiva(usuario) {
  formulariosDiv.style.display = 'none';
  sesionActivaDiv.classList.add('visible');
  const username = usuario.user_metadata?.username || usuario.email;
  nombreUsuarioP.textContent = `Conectado como: ${username}`;
}

comprobarSesion();

// ---------- INICIAR SESIÓN ----------
document.getElementById('btn-iniciar').addEventListener('click', async () => {
  const usuario = document.getElementById('usuario-login').value.trim();
  const clave = document.getElementById('clave-login').value;
  const msg = document.getElementById('mensaje-iniciar');
  const restaurar = setCargando(document.getElementById('btn-iniciar'), 'Entrar');

  const resultado = await window.cubeAuth.iniciarSesion(usuario, clave);
  restaurar();

  if (resultado.exito) {
    mostrarMensaje(msg, resultado.texto, 'exito');
    setTimeout(() => window.location.href = 'cube.html', 1200);
  } else {
    mostrarMensaje(msg, resultado.texto, 'error');
  }
});

// ---------- REGISTRARSE ----------
document.getElementById('btn-registrar').addEventListener('click', async () => {
  const usuario = document.getElementById('usuario-registro').value.trim();
  const email = document.getElementById('email-registro').value.trim();
  const clave = document.getElementById('clave-registro').value;
  const msg = document.getElementById('mensaje-registrar');
  const restaurar = setCargando(document.getElementById('btn-registrar'), 'Crear cuenta');

  const resultado = await window.cubeAuth.registrarUsuario(usuario, email, clave);
  restaurar();

  if (resultado.exito) {
    mostrarMensaje(msg, resultado.texto, 'exito');
  } else {
    mostrarMensaje(msg, resultado.texto, 'error');
  }
});

// ---------- CERRAR SESIÓN ----------
document.getElementById('btn-salir').addEventListener('click', async () => {
  await window.cubeAuth.cerrarSesion();
  window.location.href = 'cuenta.html';
});
</script>
</body>
</html>
