<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claves VAPID</title>
<style>
  body { font-family: system-ui, sans-serif; background: #000; color: #fff; padding: 20px; max-width: 560px; margin: 0 auto; line-height: 1.5; }
  button { background: #c6ff00; color: #000; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 1rem; }
  textarea { width: 100%; background: #111; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 10px; font-size: .9rem; }
  p { color: #b9b9b9; font-size: .9rem; }
</style>
</head>
<body>
<h1>Claves VAPID</h1>
<p>Las claves se generan en tu navegador y no se envían a ningún lado. Cuando las hayas copiado, borra este archivo del repositorio.</p>
<button id="g">Generar claves</button>
<p>Clave pública (va en cube-config.js y en los Secrets de Supabase):</p>
<textarea id="pub" readonly rows="3"></textarea>
<p>Clave privada (solo va en los Secrets de Supabase. No la publiques en ningún archivo):</p>
<textarea id="priv" readonly rows="3"></textarea>
<script>
  const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  document.getElementById('g').onclick = async () => {
    const k = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    document.getElementById('pub').value = b64(await crypto.subtle.exportKey('raw', k.publicKey));
    document.getElementById('priv').value = (await crypto.subtle.exportKey('jwk', k.privateKey)).d;
  };
</script>
</body>
</html>
